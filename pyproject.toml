[project]
name = "graph"
version = "0.1.0"
description = ""
authors = [
    {name = "Park_Jimin",email = "parkjimin788@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "matplotlib (>=3.10.3,<4.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "charset-normalizer (>=3.4.2,<4.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "fastparquet (>=2024.11.0,<2025.0.0)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "medmnist @ git+https://github.com/MedMNIST/MedMNIST.git",
    "requests (>=2.32.5,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)"
]

[tool.poetry]
packages = [{include = "graph", from = "src"}]


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
